# Prometheus Configuration for AI Model Serving Platform
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "ai_model_serving_api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8000", "127.0.0.1:8000"]
        labels:
          environment: "production"
          service: "intent-classification-service"
