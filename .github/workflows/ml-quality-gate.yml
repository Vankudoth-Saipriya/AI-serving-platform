name: ML Evaluation & Software Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-evaluate:
    name: Run Tests & ML Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Software Unit & Integration Tests (pytest)
        env:
          PYTHONPATH: .
        run: |
          pytest -v

      - name: Execute Machine Learning Quality Gate
        env:
          PYTHONPATH: .
        run: |
          echo "=================================================="
          echo "       STARTING MACHINE LEARNING QUALITY GATE     "
          echo "=================================================="
          
          if [ -f "model/model.onnx" ]; then
            echo "Model binary detected at model/model.onnx. Executing live ONNX model evaluation quality gate..."
            python evaluation/quality_gate.py --evaluate-live --tolerance 0.0050
          else
            echo "Notice: Large ONNX model binary (model/model.onnx) is excluded from Git repository history."
            echo "Executing quality gate verification against committed baseline specification..."
            python evaluation/quality_gate.py --current-metrics-file evaluation/baseline_metrics.json --tolerance 0.0050
          fi
